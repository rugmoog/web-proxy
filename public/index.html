<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remote browser</title>
  <style>
    body { margin: 0; font: 15px system-ui, sans-serif; background: #eee; }
    form { display: flex; gap: 8px; padding: 10px; background: #222; }
    input { flex: 1; min-width: 0; padding: 8px; }
    button { padding: 8px 12px; cursor: pointer; }
    #status { padding: 6px 10px; color: #444; }
    #screen {
  display: block;
  width: 100%;
  height: auto;
  background: white;
  cursor: crosshair;
}
#page-controls {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 8px;
  align-items: center;
  padding: 8px 10px;
  background: #ddd;
}

#remote-scroll {
  width: 100%;
}

#type-form {
  grid-column: 1 / -1;
  display: flex;
  gap: 8px;
}

@media (max-width: 500px) {
  #page-controls {
    grid-template-columns: 1fr;
  }
}


  </style>
</head>
<body>
  <form id="toolbar">
    <button type="button" data-action="back">Back</button>
    <button type="button" data-action="forward">Forward</button>
    <button type="button" data-action="reload">Reload</button>
    <input id="address" aria-label="URL" placeholder="Enter an allowed HTTPS URL">
    <button type="submit">Go</button>
  </form>
  <div id="page-controls">
  <label for="remote-scroll">Page scroll</label>
  <input id="remote-scroll" type="range" min="0" max="0" value="0" disabled>

  <form id="type-form">
    <input id="type-text" type="text" placeholder="Type into the focused page" autocomplete="off">
    <button type="submit">Send</button>
    <button id="send-enter" type="button">Enter</button>
  </form>
</div>


  <div id="status">Connecting…</div>
  <img id="screen" alt="Remote browser view" tabindex="0">

  <script>
    const address = document.querySelector("#address");
    const status = document.querySelector("#status");
    const screen = document.querySelector("#screen");

    function refreshScreen() {
      screen.src = `/api/screen?t=${Date.now()}`;
    }

    async function callApi(path, body) {
      status.textContent = "Loading…";
      const response = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body ?? {})
      });
      const result = await response.json();

      if (!response.ok) {
        status.textContent = result.error || "Request failed";
        return;
      }

      if (result.url) address.value = result.url;
      status.textContent = result.url || "Ready";
      refreshScreen();
      refreshScroll();
    }

    document.querySelector("#toolbar").addEventListener("submit", (event) => {
      event.preventDefault();
      callApi("/api/navigate", { url: address.value });
    });

    document.querySelectorAll("[data-action]").forEach((button) => {
      button.addEventListener("click", () => {
        callApi(`/api/${button.dataset.action}`);
      });
    });


const remoteScroll = document.querySelector("#remote-scroll");
const typeForm = document.querySelector("#type-form");
const typeText = document.querySelector("#type-text");

async function refreshScroll() {
  try {
    const response = await fetch(`/api/scroll-state?t=${Date.now()}`);
    const state = await response.json();

    const max = Math.max(0, Number(state.max) || 0);
    remoteScroll.max = String(max);
    remoteScroll.value = String(Math.min(max, Math.max(0, Number(state.top) || 0)));
    remoteScroll.disabled = max === 0;
  } catch {
    // The next refresh can retry.
  }
}

remoteScroll.addEventListener("change", () => {
  callApi("/api/scroll-to", { y: Number(remoteScroll.value) });
});

typeForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const text = typeText.value;
  if (!text) return;

  await callApi("/api/input/type", { text });
  typeText.value = "";
  typeText.focus();
});

document.querySelector("#send-enter").addEventListener("click", () => {
  callApi("/api/input/key", { key: "Enter" });
});


    let inputQueue = Promise.resolve();

function queueInput(path, body) {
  inputQueue = inputQueue
    .then(() => callApi(path, body))
    .catch((error) => {
      status.textContent = error.message;
    });
}

screen.addEventListener("click", (event) => {
  const rect = screen.getBoundingClientRect();
  if (!screen.naturalWidth || !rect.width || !rect.height) return;

  const x = (event.clientX - rect.left) * screen.naturalWidth / rect.width;
  const y = (event.clientY - rect.top) * screen.naturalHeight / rect.height;

  screen.focus();
  queueInput("/api/input/click", { x, y });
});

const pageKeys = new Set([
  "Enter", "Tab", "Escape", "Backspace", "Delete",
  "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight",
  "Home", "End", "PageUp", "PageDown", " "
]);

screen.addEventListener("keydown", (event) => {
  if (document.activeElement !== screen || event.ctrlKey || event.metaKey || event.altKey) {
    return;
  }

  if (event.key.length === 1) {
    event.preventDefault();
    queueInput("/api/input/type", { text: event.key });
  } else if (pageKeys.has(event.key)) {
    event.preventDefault();
    const key = event.key === " " ? "Space" : event.key;
    queueInput("/api/input/key", { key });
  }
});

    fetch("/api/status")
      .then((response) => response.json())
      .then((result) => {
        address.value = result.url || "";
        status.textContent = `Allowed site: ${result.allowedOrigin}`;
        refreshScreen();
        refreshScroll();
      })
      .catch(() => {
        status.textContent = "Could not reach the browser server.";
      });

    setInterval(refreshScreen, 300);
  </script>
</body>
</html>
